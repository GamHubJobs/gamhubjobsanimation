<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GamHub Jobs — Opportunities Reel</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<!--
  HOW TO RECORD
  ─────────────
  #stage is a fixed 1080×1920 (9:16) canvas — the actual video
  frame. It's centered and auto-scaled to fit whatever browser
  window you open this in, so you can screen-record the window
  directly, or point a capture tool (OBS, etc.) at #stage itself
  for native 1080×1920 output. Nothing outside #stage is part of
  the shot.
-->

<div id="stage-viewport">
  <div id="stage">

    <div id="gh-fade-top"></div>
    <div id="gh-fade-bottom"></div>

    <header id="gh-header">
      <div id="gh-brand">
        <div id="gh-brand-mark">✦</div>
        <div id="gh-brand-text">GamHub Jobs</div>
      </div>
      <p id="gh-tagline">Thousands of potential job opportunities across The Gambia could be awaiting your application.</p>
      <div id="gh-stat-row">
        <span class="gh-stat-pill"><b>2,400+</b>&nbsp;jobs listed</span>
        <span class="gh-stat-pill">📍 <b>Nationwide</b></span>
      </div>
    </header>

    <div id="gh-scroll-mask">
      <div id="gh-scroll-track"></div>
    </div>

    <div id="gh-endcard">
      <div id="gh-endcard-mark">✦</div>
      <div id="gh-endcard-title">So many opportunities<br><em>waiting for you.</em></div>
      <div id="gh-endcard-sub">GamHub Jobs — Gambia's #1 Career Platform</div>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
