<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Ad Template</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ==================================================
       MAIN ADVERTISEMENT CONTAINER (layers, top to bottom):
       1. background photo   2. curved separator + color panel
       3. brand logo         4. job title       5. company logo
       6. apply CTA
       ================================================== -->
  <div class="jobad" id="jobad">

    <img class="jobad__photo" id="jobadPhoto" alt="">
    <div class="jobad__scrim"></div>

    <!-- Curved white/cream + gold panel. Purely vector — never distorts
         when the background photo changes. Adjust the two path "d"
         values below if you want a different curve silhouette. -->
    <svg class="jobad__curve" viewBox="0 0 400 500" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="panelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="var(--primary-brown)"/>
          <stop offset="100%" stop-color="var(--dark-brown)"/>
        </linearGradient>
      </defs>
      <!-- cream border sliver -->
      <path d="M400,0 C250,50 190,150 255,240 C320,330 210,390 255,470 C275,492 340,498 400,500 Z" fill="var(--cream)"/>
      <!-- solid brown/gold panel, offset right to reveal the cream sliver -->
      <path d="M400,0 C250,50 190,150 255,240 C320,330 210,390 255,470 C275,492 340,498 400,500 Z"
            transform="translate(16,0)" fill="url(#panelGradient)"/>
    </svg>

    <div class="jobad__brand" id="jobadBrandWrap">
      <img id="jobadBrandImg" alt="Brand logo" style="display:none;">
      <div class="jobad__brand-fallback" id="jobadBrandFallback">GAM<span>HUBJOBS</span>.com</div>
    </div>

    <div class="jobad__title-wrap">
      <span class="jobad__title" id="jobadTitle"></span>
    </div>

    <div class="jobad__company">
      <img id="jobadCompanyLogo" alt="Company logo">
    </div>

    <a class="jobad__cta" id="jobadCta" href="#" target="_blank" rel="noopener"></a>

  </div>

  <script src="script.js"></script>
</body>
</html>
